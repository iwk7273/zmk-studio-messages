syntax = "proto3";

package zmk.meteorite;

import "keymap.proto";

message Request {
    oneof request_type {
        bool get_config_state = 1;
        SetConfigRequest set_config = 2;
        bool check_unsaved_changes = 3;
        bool save_changes = 4;
        bool discard_changes = 5;
    }
}

message Response {
    oneof response_type {
        ConfigState get_config_state = 1;
        SetConfigResponse set_config = 2;
        bool check_unsaved_changes = 3;
        SaveChangesResponse save_changes = 4;
        bool discard_changes = 5;
    }
}

message Notification {
    oneof notification_type {
        ConfigState config_state_changed = 1;
        bool unsaved_changes_status_changed = 2;
    }
}

message SetConfigRequest {
    ConfigValues config = 1;
}

enum SetConfigResponse {
    SET_CONFIG_RESP_OK = 0;
    SET_CONFIG_RESP_ERR_INVALID_VALUE = 1;
    SET_CONFIG_RESP_ERR_GENERIC = 2;
}

message SaveChangesResponse {
    oneof result {
        bool ok = 1;
        SaveChangesErrorCode err = 2;
    }
}

enum SaveChangesErrorCode {
    SAVE_CHANGES_ERR_OK = 0;
    SAVE_CHANGES_ERR_GENERIC = 1;
    SAVE_CHANGES_ERR_NOT_SUPPORTED = 2;
    SAVE_CHANGES_ERR_NO_SPACE = 3;
}

message ConfigState {
    reserved 8;
    reserved "encoder_slots";

    uint32 schema_version = 1;
    string firmware_feature_version = 2;
    repeated ConfigField fields = 3;
    ConfigValues current = 4;
    ConfigValues saved = 5;
    ConfigValues defaults = 6;
    bool dirty = 7;
}

message ConfigValues {
    uint32 cpi_idx = 1;
    uint32 scroll_div = 2;
    uint32 rotation_idx = 3;
    uint32 scroll_h_rev = 4;
    uint32 scroll_v_rev = 5;
    uint32 scaling_mode = 6;
    uint32 scroll_scaling_mode = 7;
    // Frozen for backward compatibility. No longer used for routing; superseded
    // by ball_config.layer_profiles (migrated to a SCROLL profile). Always
    // reported at defaults.
    uint32 scroll_layer_1 = 8;
    uint32 scroll_layer_2 = 9;
    uint32 os_mode = 10;
    // Optional. Absence (no submessage presence) means "preserve existing ball
    // state", so an older client that does not know about ball profiles can
    // still set the scalar values without clobbering ball_config.
    BallConfig ball_config = 11;
}

// Ball Profile assigned per keymap layer.
// APP is a reserved value (hidden in the v1 UI).
enum BallProfile {
    BALL_PROFILE_OFF = 0;
    BALL_PROFILE_SCROLL = 1;
    BALL_PROFILE_BROWSER = 2;
    BALL_PROFILE_DESKTOP = 3;
    BALL_PROFILE_WINDOW = 4;
    BALL_PROFILE_APP = 5;
    BALL_PROFILE_USER1 = 6;
}

// Shared accumulation threshold for all action profiles. Higher = less
// sensitive (needs a larger flick before one action fires).
//
// The enum integer values are in sensitivity order (VERY_LIGHT most sensitive
// .. VERY_HEAVY least), so a slider can map its position directly to the value.
// Any future level must be appended at the end (>= 5) to keep saved configs
// stable; do not renumber these.
enum BallSensitivity {
    BALL_SENSITIVITY_VERY_LIGHT = 0;  // most sensitive (smallest flick)
    BALL_SENSITIVITY_LIGHT = 1;
    BALL_SENSITIVITY_NORMAL = 2;
    BALL_SENSITIVITY_HEAVY = 3;
    BALL_SENSITIVITY_VERY_HEAVY = 4;  // least sensitive (largest flick)
}

enum BallDirection {
    BALL_DIRECTION_LEFT = 0;
    BALL_DIRECTION_RIGHT = 1;
    BALL_DIRECTION_UP = 2;
    BALL_DIRECTION_DOWN = 3;
}

message BallConfig {
    // Indexed by keymap layer index. Fixed max_count 16 (see meteorite.options).
    repeated BallProfile layer_profiles = 1;
    // Shared threshold for all action profiles. Firmware always populates this
    // explicitly (do not rely on the proto3 zero-default).
    BallSensitivity sensitivity = 2;
    // Indexed by BallDirection (LEFT, RIGHT, UP, DOWN). Fixed max_count 4.
    repeated zmk.keymap.BehaviorBinding user1_bindings = 3;
}

message ConfigField {
    string id = 1;
    string label = 2;
    ConfigFieldKind kind = 3;
    string unit = 4;
    sint32 min = 5;
    sint32 max = 6;
    sint32 step = 7;
    bool read_only = 8;
    string fixed_reason = 9;
    repeated ConfigFieldOption options = 10;
}

enum ConfigFieldKind {
    CONFIG_FIELD_KIND_RANGE = 0;
    CONFIG_FIELD_KIND_TOGGLE = 1;
    CONFIG_FIELD_KIND_ENUM = 2;
    CONFIG_FIELD_KIND_INDEXED = 3;
}

message ConfigFieldOption {
    sint32 value = 1;
    string label = 2;
    sint32 display_value = 3;
    string display_label = 4;
}
